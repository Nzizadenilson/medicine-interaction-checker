<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medication Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Medication Checker</h1>
        <p class="info">Search for information about any medicine easily</p>
      </header>
      <main>
        <form id="medicationform" action="/medicine" method="GET">
          <label for="medicine"> Enter medicine name </label>
          <input
            id="medicine"
            type="text"
            name="medicine"
            placeholder="e.g amoxicillin"
            required
          />
          <label for="filter">Information to display</label>

          <select id="filter">
            <option value="all">All Information</option>
            <option value="description">Description</option>
            <option value="warnings">Warnings</option>
            <option value="dosage">Dosage</option>
            <option value="instructions">Instructions</option>
          </select>
          <button id="button" type="submit">Search</button>
        </form>
        <section id="results"></section>
      </main>

      <footer class="footer">
        <p>medication checker(Quick recovery)</p>
      </footer>
    </div>
    <script src="medication_js/script.js"></script>
  </body>
</html>
