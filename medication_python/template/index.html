<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Medication Checker</h1>
        <p class="info">Search for information about any medicine easily</p>
      </header>
      <main>
        <form id="medicationform" action="/medicine" method="GET">
          <label for="medicine"> Enter medicine name </label>
          <input
            id="medicine"
            type="text"
            name="medicine"
            placeholder="e.g Panadol"
            required
          />
          <button id="button" type="submit">Search</button>
        </form>
        <section id="results"></section>
      </main>

      <footer class="footer">
        <p>medication checker(Quick recovery)</p>
      </footer>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
